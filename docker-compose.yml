services:
  api:
    build: ./apps/api
    container_name: omnidocai-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      - ./storage:/app/storage
      # Seeded from the image; keeps the embedding model across container recreates.
      # fastembed caches here, not under ~/.cache.
      - embedding_cache:/tmp/fastembed_cache
    env_file:
      - .env
    restart: unless-stopped

  web:
    build: ./apps/web
    container_name: omnidocai-web
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  embedding_cache:
